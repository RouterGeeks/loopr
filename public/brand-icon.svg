<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed background; the platform supplies the Home Screen corner mask. -->
  <rect width="512" height="512" fill="#C9BEDC"/>
  <!-- Morse D: one dash followed by two dots, centered inside the maskable safe area. -->
  <rect x="80" y="224" width="160" height="64" rx="32" fill="#3E3B37"/>
  <circle cx="304" cy="256" r="32" fill="#3E3B37"/>
  <circle cx="400" cy="256" r="32" fill="#3E3B37"/>
</svg>
